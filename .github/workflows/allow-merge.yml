name: Allow Merge

on:
  workflow_call:
    inputs:
      failed:
        description: >
          Pass 'true' when any required upstream job failed or was cancelled.
          Derive with:
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        required: true
        type: string

jobs:
  allow-merge:
    name: allow-merge
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          FAILED: ${{ inputs.failed }}
        run: |
          if [[ "$FAILED" == "true" ]]; then
            echo "One or more required checks failed or were cancelled."
            exit 1
          fi
          echo "All required checks passed."
