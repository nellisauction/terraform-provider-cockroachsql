name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'

      - run: go mod vendor

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  build-devcontainer:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker builder (Blacksmith layer cache)
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build dev container image
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: echo "Dev container image built and cached"

  test:
    needs: build-devcontainer
    runs-on: blacksmith-4vcpu-ubuntu-2204
    strategy:
      matrix:
        crdbversion:
          - latest-v26.1
          - latest-v25.4
          - latest-v25.3
          - latest-v25.2
          - latest-v25.1
          - latest-v24.3
          - latest-v24.2
          - latest-v24.1
          - latest-v23.2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker builder (Blacksmith layer cache)
        uses: useblacksmith/setup-docker-builder@v1

      - name: Run tests in dev container
        uses: devcontainers/ci@v0.3
        env:
          CRDBVERSION: ${{ matrix.crdbversion }}
        with:
          push: never
          runCmd: |
            make test
            make vet
            make testacc

  test-secure:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    env:
      CRDB_IMAGE: cockroachdb/cockroach:latest-v26.1
      TF_ACC: "true"
      COCKROACH_HOST: localhost
      COCKROACH_PORT: "26257"
      COCKROACH_USER: tf_admin
      COCKROACH_SSLMODE: require
      COCKROACH_DATABASE: tf_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'

      - name: Start secure CockroachDB with a non-root admin user
        run: |
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          echo "COCKROACH_PASSWORD=$password" >> "$GITHUB_ENV"
          scripts/start-secure-cockroach.sh "$CRDB_IMAGE" "$COCKROACH_PORT" "$COCKROACH_USER" "$password" "$COCKROACH_DATABASE"

      - name: Run acceptance tests
        run: make testacc

  allow-merge:
    if: always()
    needs: [lint, build-devcontainer, test, test-secure]
    uses: ./.github/workflows/allow-merge.yml
    with:
      failed: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
